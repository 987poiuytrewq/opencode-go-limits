<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="464" height="152" viewBox="0 0 464 152" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">OpenCode Go pace sidebar with a bold title and behind-pace, ahead-of-pace, and critical monthly bars</title>
  <desc id="demo-desc">The OpenCode Go panel in pace mode, rendered by OpenTUI at the 40-column sidebar width with fake usage data. The 4 visible rows read: OpenCode Go                         pace
5-hour  ━━━━━━━━━━━━━━────────────── 42%
Weekly  ━━━━━━━━━━━━━━━━━─────────── 61%
Monthly ━━━━━━━━━─────────────────── 28%</desc>
  <rect width="464" height="152" rx="14" fill="#0a0a0a"/>
  <rect x="12.5" y="12.5" width="439" height="127" rx="10" fill="#141414" stroke="#2a2a2a"/>
  <g font-family="'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace" font-size="16">
    <text x="32" y="40" dominant-baseline="central" textLength="110" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" font-weight="bold" xml:space="preserve">OpenCode Go</text>
    <text x="392" y="40" dominant-baseline="central" textLength="40" lengthAdjust="spacingAndGlyphs" fill="#8b949e" xml:space="preserve">pace</text>
    <text x="32" y="64" dominant-baseline="central" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" xml:space="preserve">5-hour</text>
    <rect x="112" y="62" width="120" height="4" fill="#3fb950"/>
    <rect x="232" y="62" width="20" height="4" fill="#8b949e"/>
    <rect x="252" y="63.5" width="140" height="1" fill="#8b949e"/>
    <text x="402" y="64" dominant-baseline="central" textLength="30" lengthAdjust="spacingAndGlyphs" fill="#3fb950" xml:space="preserve">42%</text>
    <text x="32" y="88" dominant-baseline="central" textLength="60" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" xml:space="preserve">Weekly</text>
    <rect x="112" y="86" width="140" height="4" fill="#3fb950"/>
    <rect x="252" y="86" width="30" height="4" fill="#d29922"/>
    <rect x="282" y="87.5" width="110" height="1" fill="#8b949e"/>
    <text x="402" y="88" dominant-baseline="central" textLength="30" lengthAdjust="spacingAndGlyphs" fill="#d29922" xml:space="preserve">61%</text>
    <text x="32" y="112" dominant-baseline="central" textLength="70" lengthAdjust="spacingAndGlyphs" fill="#c9d1d9" xml:space="preserve">Monthly</text>
    <rect x="112" y="110" width="80" height="4" fill="#3fb950"/>
    <rect x="192" y="110" width="10" height="4" fill="#8b949e"/>
    <rect x="202" y="111.5" width="190" height="1" fill="#8b949e"/>
    <text x="402" y="112" dominant-baseline="central" textLength="30" lengthAdjust="spacingAndGlyphs" fill="#3fb950" xml:space="preserve">28%</text>
  </g>
</svg>
